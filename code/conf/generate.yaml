defaults:
  - subject: backpack
  - mode: full
  - _self_

# Public reproduction path: image generation with Stable Diffusion v1.5.
# Switch mode=lora on the CLI to load LoRA adapters from the LoRA training dir.
# Set task to null to auto-detect from the saved checkpoint; override only when
# loading a base Hugging Face model id.
#
# model.model_path and inference.output_dir are supplied by the mode group:
#   mode=full -> subject.train_output_dir_full / subject.samples_output_dir_full
#   mode=lora -> subject.train_output_dir_lora / subject.samples_output_dir_lora
task: image

inference:
  prompts: ${subject.prompts}
  prompts_file: null
  num_images_per_prompt: 4
  # image-only output size; also used when encoding anchor.subject_dir latents
  height: 512
  width: 512
  guidance_scale: 7.5
  num_inference_steps: 50

runtime:
  seed: 0

# Experimental, opt-in: classifier-guidance-style biasing toward a VAE latent of
# the subject images. Image task only. Implementation lives in code/anchor.py;
# leave anchor.enabled: false for the standard SD inference path.
# After each scheduler step:
#   latents <- (1 - w_t) * latents + w_t * noised_anchor
# where the anchor is selected per `mode` and w_t is computed per `schedule`.
anchor:
  enabled: false
  subject_dir: ${subject.instance_data_dir}
  weight: 0.15
  # pooled            -> mean of all N subject latents (tends to blur)
  # random_per_sample -> pick one subject latent per output, fixed across all steps
  # random_per_step   -> resample a different subject latent at every denoising step
  # nearest           -> choose the noised subject latent nearest to the current latent at each step
  # soft_nearest      -> softmax-weight all noised subject latents by distance at each step
  mode: pooled
  # constant     -> w everywhere
  # linear_decay -> w * (1 - step/(total-1)); strong early, fades to 0 at the end
  # early_only   -> w for first half of steps, 0 for second half
  schedule: constant
  # Used only by soft_nearest. Lower values behave more like hard nearest selection.
  temperature: 0.25
  # Reuse one fixed noise tensor per subject anchor across denoising steps for
  # a coherent noised-anchor trajectory. When false, anchor noise is resampled.
  consistent_noise: false

# Optional image-only semantic feature guidance. Uses anchor.subject_dir as the
# subject reference set, computes a mean DINO target embedding, estimates x0
# during sampling, decodes it, and nudges latents with the DINO feature loss.
semantic_guidance:
  enabled: false
  model: dino
  weight: 0.02
  # none preserves the original raw-gradient behavior. rms makes weight an
  # approximate per-latent-element RMS step size, which is easier to ablate.
  gradient_normalization: none
  normalization_eps: 1.0e-8
  # Optional guardrail on ||update|| / ||latents||. Set 0 to disable.
  max_update_norm_ratio: 0.0
  # constant_window     -> full weight throughout start/end window
  # linear_decay_window -> full at start, linearly fades to 0 at end
  # warmup_hold_decay   -> full from start to hold_until, fades to 0 by end
  schedule: warmup_hold_decay
  every_n_steps: 5
  start_step_frac: 0.20
  hold_until_frac: 0.60
  end_step_frac: 0.70
  target: mean
  diagnostics_enabled: false
  # Relative paths are written inside inference.output_dir; null uses
  # inference.output_dir/semantic_guidance_diagnostics.
  diagnostics_dir: null
  diagnostics_recompute_loss_after: true

hydra:
  job:
    chdir: false
